

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recicla-ai-backend-prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FLASK_ENV: production
      FLASK_DEBUG: 0
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - recicla-ai-network

networks:
  recicla-ai-network:
    driver: bridge
