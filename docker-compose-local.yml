services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recicla-ai-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./recicla_ai.db}
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - .:/app
    networks:
      - recicla-ai-network

networks:
  recicla-ai-network:
    driver: bridge
